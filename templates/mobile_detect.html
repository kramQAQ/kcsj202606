<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>饮片识别</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211c;
      --muted: #66736c;
      --line: #dce5df;
      --brand: #147a54;
      --brand-dark: #0e5f41;
      --warn: #9a4b13;
      --bg: #f5f7f4;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      max-width: 860px;
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 720;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    main {
      padding: 14px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #111;
      overflow: hidden;
      border: 1px solid #111;
      border-radius: 8px;
    }

    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #overlay {
      pointer-events: none;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      min-height: 44px;
      padding: 0 14px;
      font-size: 15px;
      font-weight: 680;
      color: #fff;
      background: var(--brand);
    }

    button:active {
      background: var(--brand-dark);
    }

    button.secondary {
      color: var(--ink);
      background: #e6eee9;
    }

    button:disabled {
      opacity: 0.58;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--brand);
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status.error {
      color: var(--warn);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .metric {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
    }

    .metric strong {
      display: block;
      font-size: 20px;
      line-height: 1.1;
    }

    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .counts,
    .detections {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
      font-size: 14px;
    }

    .row small {
      color: var(--muted);
    }

    footer {
      padding: 10px 14px 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .controls,
      .summary {
        grid-template-columns: 1fr;
      }

      header {
        padding-top: max(14px, env(safe-area-inset-top));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>中医药饮片识别</h1>
      <div class="subtitle">当前模型：exp2_bifpn，拍照上传识别</div>
    </header>

    <main>
      <section class="stage" aria-label="摄像头画面">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </section>

      <section class="panel">
        <div class="controls">
          <button id="detectBtn" type="button">拍照识别</button>
          <button id="fileBtn" class="secondary" type="button">相册/相机</button>
          <button id="cameraBtn" class="secondary" type="button">重新打开摄像头</button>
        </div>
        <input id="photoInput" type="file" accept="image/*" capture="environment" style="display: none;">
        <label style="margin-top: 12px;">
          置信度阈值：<span id="confText">{{ "%.2f"|format(default_conf) }}</span>
          <input id="confRange" type="range" min="0.10" max="0.80" step="0.05" value="{{ default_conf }}">
        </label>
        <div id="status" class="status" style="margin-top: 10px;">正在打开摄像头...</div>
      </section>

      <section class="panel">
        <div class="summary">
          <div class="metric"><strong id="total">0</strong><span>识别数量</span></div>
          <div class="metric"><strong id="kindCount">0</strong><span>药材种类</span></div>
          <div class="metric"><strong id="elapsed">-</strong><span>推理耗时</span></div>
        </div>
        <div id="counts" class="counts"></div>
        <div id="detections" class="detections"></div>
      </section>
    </main>

    <footer>手机与运行服务的电脑需在同一网络；公网部署时请使用 HTTPS。</footer>
  </div>

  <script>
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const ctx = overlay.getContext("2d");
    const detectBtn = document.getElementById("detectBtn");
    const fileBtn = document.getElementById("fileBtn");
    const photoInput = document.getElementById("photoInput");
    const cameraBtn = document.getElementById("cameraBtn");
    const confRange = document.getElementById("confRange");
    const confText = document.getElementById("confText");
    const statusEl = document.getElementById("status");
    const totalEl = document.getElementById("total");
    const kindCountEl = document.getElementById("kindCount");
    const elapsedEl = document.getElementById("elapsed");
    const countsEl = document.getElementById("counts");
    const detectionsEl = document.getElementById("detections");

    let stream = null;
    let lastImageSize = null;

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function resizeOverlay(width, height) {
      overlay.width = width;
      overlay.height = height;
      ctx.clearRect(0, 0, width, height);
    }

    async function openCamera() {
      setStatus("正在打开摄像头...");
      detectBtn.disabled = true;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 960 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        resizeOverlay(video.videoWidth || 640, video.videoHeight || 480);
        setStatus("摄像头已打开，可以拍照识别。");
        detectBtn.disabled = false;
      } catch (err) {
        setStatus("摄像头打开失败：请检查浏览器权限，公网访问需要 HTTPS。", true);
      }
    }

    function makeFrameCanvas() {
      const canvas = document.createElement("canvas");
      const width = video.videoWidth || 640;
      const height = video.videoHeight || 480;
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(video, 0, 0, width, height);
      lastImageSize = { width, height };
      resizeOverlay(width, height);
      return canvas;
    }

    async function showUploadedImage(file) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.src = url;
      await img.decode();
      const width = img.naturalWidth;
      const height = img.naturalHeight;
      resizeOverlay(width, height);
      ctx.drawImage(img, 0, 0, width, height);
      lastImageSize = { width, height };
      URL.revokeObjectURL(url);
    }

    function canvasToBlob(canvas) {
      return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.86));
    }

    function drawDetections(detections) {
      if (!lastImageSize) return;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      ctx.lineWidth = Math.max(2, Math.round(overlay.width / 360));
      ctx.font = `${Math.max(14, Math.round(overlay.width / 40))}px system-ui`;

      detections.forEach(item => {
        const [x1, y1, x2, y2] = item.box;
        const w = x2 - x1;
        const h = y2 - y1;
        const label = `${item.name} ${(item.confidence * 100).toFixed(1)}%`;

        ctx.strokeStyle = "#20b174";
        ctx.fillStyle = "#20b174";
        ctx.strokeRect(x1, y1, w, h);

        const textWidth = ctx.measureText(label).width;
        const labelY = Math.max(0, y1 - 24);
        ctx.fillRect(x1, labelY, textWidth + 10, 22);
        ctx.fillStyle = "#fff";
        ctx.fillText(label, x1 + 5, labelY + 16);
      });
    }

    function renderResult(data) {
      totalEl.textContent = data.total;
      const countEntries = Object.entries(data.counts || {});
      kindCountEl.textContent = countEntries.length;
      elapsedEl.textContent = `${data.elapsed_ms}ms`;

      countsEl.innerHTML = countEntries
        .sort((a, b) => b[1] - a[1])
        .map(([name, count]) => `<div class="row"><span>${name}</span><strong>${count}</strong></div>`)
        .join("");

      detectionsEl.innerHTML = data.detections
        .map(item => `
          <div class="row">
            <span>${item.name}<br><small>置信度 ${(item.confidence * 100).toFixed(1)}%</small></span>
            <strong>#${item.class_id}</strong>
          </div>
        `)
        .join("");

      drawDetections(data.detections);
      setStatus(data.total ? `识别完成，共 ${data.total} 个目标。` : "未识别到目标，可降低阈值或重新拍照。");
    }

    async function uploadAndDetect(blob, fileName = "frame.jpg") {
      detectBtn.disabled = true;
      fileBtn.disabled = true;
      setStatus("正在上传并识别...");

      try {
        const form = new FormData();
        form.append("file", blob, fileName);
        form.append("conf", confRange.value);

        const res = await fetch("/api/detect", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok || data.status !== "ok") {
          throw new Error(data.message || "识别失败");
        }
        renderResult(data);
      } catch (err) {
        setStatus(`识别失败：${err.message}`, true);
      } finally {
        detectBtn.disabled = false;
        fileBtn.disabled = false;
      }
    }

    async function detect() {
      if (!video.srcObject) {
        setStatus("摄像头未打开，可使用“相册/相机”上传识别。", true);
        return;
      }

      const frame = makeFrameCanvas();
      const blob = await canvasToBlob(frame);
      await uploadAndDetect(blob);
    }

    async function detectFile(file) {
      if (!file) return;
      await showUploadedImage(file);
      await uploadAndDetect(file, file.name || "photo.jpg");
    }

    confRange.addEventListener("input", () => {
      confText.textContent = Number(confRange.value).toFixed(2);
    });
    detectBtn.addEventListener("click", detect);
    fileBtn.addEventListener("click", () => photoInput.click());
    photoInput.addEventListener("change", () => detectFile(photoInput.files[0]));
    cameraBtn.addEventListener("click", openCamera);
    openCamera();
  </script>
</body>
</html>
