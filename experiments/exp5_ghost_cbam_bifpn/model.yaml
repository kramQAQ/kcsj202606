  - [-1, 1, CBAM, [7]]

  - [-1, 1, GhostConv, [512, 3, 2]]
  - [[-1, 15, 6], 1, BiFPN_Add3, []]
  - [-1, 3, C2fGhost, [512]]
  - [-1, 1, CBAM, [7]]

  - [-1, 1, GhostConv, [1024, 3, 2]]
  - [[-1, 10], 1, BiFPN_Add2, []]
  - [-1, 3, C2fGhost, [1024]]
  - [-1, 1, CBAM, [7]]

  - [[20, 24, 28], 1, Detect, [nc]]

